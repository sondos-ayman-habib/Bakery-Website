server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Health endpoint used by Docker HEALTHCHECK and CI
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpe?g|mp4|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
