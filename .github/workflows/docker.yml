name: Docker build and smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: bakery-website:ci

      - name: Run container and check /health
        run: |
          docker run -d --name bakery -p 8080:80 bakery-website:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:8080/health && break
            sleep 1
          done
          curl -fs http://localhost:8080/ | grep -qi "bakery"
